<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pharmacy Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --info-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.15);
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        /* Navbar styling for better contrast */
        .navbar {
            background: linear-gradient(135deg, #0f1419 0%, #1a252f 100%) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .navbar-brand, .navbar-nav .nav-link {
            color: #ffffff !important;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            color: #64b5f6 !important;
            transform: translateY(-1px);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .navbar-toggler {
            border-color: rgba(255,255,255,0.3);
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 0.85%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='m4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        .dashboard-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 20px 20px;
            box-shadow: var(--shadow-soft);
            border-top: 3px solid rgba(255,255,255,0.2);
        }

        .dashboard-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 0;
        }

        .stats-container {
            padding: 0 1rem;
        }

        .stat-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-soft);
            height: 180px;
        }

        .stat-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--shadow-hover);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 1;
        }

        .card-medicines {
            background: var(--primary-gradient);
        }

        .card-users {
            background: var(--success-gradient);
        }

        .card-orders {
            background: var(--warning-gradient);
        }

        .card-prescriptions {
            background: var(--info-gradient);
        }

        .card-body {
            position: relative;
            z-index: 2;
            padding: 2rem;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-content {
            flex: 1;
        }

        .stat-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            line-height: 1;
        }

        .stat-icon {
            font-size: 4rem;
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .stat-card:hover .stat-icon {
            opacity: 0.5;
            transform: scale(1.1);
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .floating-elements::before,
        .floating-elements::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .floating-elements::before {
            width: 60px;
            height: 60px;
            top: -30px;
            right: -30px;
            animation-delay: -2s;
        }

        .floating-elements::after {
            width: 40px;
            height: 40px;
            bottom: -20px;
            left: -20px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .pulse-animation {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .container-fluid {
            max-width: 1400px;
        }

        @media (max-width: 768px) {
            .dashboard-title {
                font-size: 2rem;
            }

            .stat-number {
                font-size: 2.5rem;
            }

            .stat-icon {
                font-size: 3rem;
            }

            .stat-card {
                height: 150px;
            }
        }

        /* Subtle animations for numbers */
        .stat-number {
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Stagger animation delays */
        .col-lg-3:nth-child(1) .stat-number { animation-delay: 0.1s; }
        .col-lg-3:nth-child(2) .stat-number { animation-delay: 0.2s; }
        .col-lg-3:nth-child(3) .stat-number { animation-delay: 0.3s; }
        .col-lg-3:nth-child(4) .stat-number { animation-delay: 0.4s; }
    </style>
</head>
<body>
<th:block th:replace="fragments/layout :: navbar"></th:block>

<div class="dashboard-header">
    <div class="container-fluid">
        <div class="text-center">
            <h1 class="dashboard-title">
                <i class="fas fa-clinic-medical me-3"></i>
                Pharmacy Dashboard
            </h1>
            <p class="lead mb-0 opacity-75">Real-time overview of your pharmacy operations</p>
        </div>
    </div>
</div>

<div class="container-fluid stats-container">
    <div class="row g-4">
        <div class="col-lg-3 col-md-6">
            <div class="card stat-card card-medicines text-white">
                <div class="floating-elements"></div>
                <div class="card-body">
                    <div class="stat-content">
                        <h5 class="stat-title">Total Medicines</h5>
                        <h2 class="stat-number" th:text="${totalMedicines}">0</h2>
                    </div>
                    <div class="stat-icon">
                        <i class="fas fa-pills"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="card stat-card card-users text-white">
                <div class="floating-elements"></div>
                <div class="card-body">
                    <div class="stat-content">
                        <h5 class="stat-title">Active Users</h5>
                        <h2 class="stat-number" th:text="${totalUsers}">0</h2>
                    </div>
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="card stat-card card-orders text-white">
                <div class="floating-elements"></div>
                <div class="card-body">
                    <div class="stat-content">
                        <h5 class="stat-title">Pending Orders</h5>
                        <h2 class="stat-number pulse-animation" th:text="${pendingOrders}">0</h2>
                    </div>
                    <div class="stat-icon">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="card stat-card card-prescriptions text-white">
                <div class="floating-elements"></div>
                <div class="card-body">
                    <div class="stat-content">
                        <h5 class="stat-title">Pending Prescriptions</h5>
                        <h2 class="stat-number pulse-animation" th:text="${pendingPrescriptions}">0</h2>
                    </div>
                    <div class="stat-icon">
                        <i class="fas fa-file-prescription"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="fragments/layout :: footer"></th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
