<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #64748b;
            --success-color: #059669;
            --warning-color: #d97706;
            --border-radius: 16px;
            --shadow-light: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-medium: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-large: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .checkout-container {
            padding: 2rem 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .checkout-card {
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-large);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            overflow: hidden;
        }

        .card-header-custom {
            background: linear-gradient(135deg, var(--primary-color) 0%, #3b82f6 100%);
            padding: 2rem;
            border: none;
            position: relative;
        }

        .card-header-custom::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.1"/><circle cx="50" cy="10" r="0.5" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            pointer-events: none;
        }

        .checkout-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            position: relative;
            z-index: 1;
        }

        .checkout-icon {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.75rem;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .card-body-custom {
            padding: 2.5rem;
            background: white;
        }

        .info-alert {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            border: 1px solid #93c5fd;
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .info-alert i {
            color: var(--primary-color);
            font-size: 1.25rem;
        }

        .info-alert-text {
            color: #1e40af;
            margin: 0;
            font-weight: 500;
        }

        .order-summary {
            background: #f8fafc;
            border-radius: 12px;
            padding: 1.75rem;
            border: 1px solid #e2e8f0;
            margin-bottom: 2rem;
        }

        .order-summary h5 {
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .order-item:last-child {
            border-bottom: none;
            padding-top: 1rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #bbf7d0;
        }

        .order-label {
            color: var(--secondary-color);
            font-weight: 500;
        }

        .order-value {
            font-weight: 600;
            color: #1e293b;
        }

        .total-amount {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--success-color);
        }

        .payment-form {
            margin-bottom: 1.5rem;
        }

        .confirm-btn {
            background: linear-gradient(135deg, var(--success-color) 0%, #10b981 100%);
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: var(--shadow-medium);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(5, 150, 105, 0.3);
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
        }

        .confirm-btn:active {
            transform: translateY(0);
        }

        .confirm-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .confirm-btn:hover::before {
            left: 100%;
        }

        .back-btn {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            color: var(--secondary-color);
            background: white;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-1px);
            box-shadow: var(--shadow-light);
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            color: var(--secondary-color);
            font-size: 0.875rem;
        }

        .security-badge i {
            color: var(--success-color);
        }

        @media (max-width: 768px) {
            .checkout-container {
                padding: 1rem;
            }

            .card-header-custom,
            .card-body-custom {
                padding: 1.5rem;
            }

            .checkout-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="container-fluid checkout-container">
    <div class="row justify-content-center w-100">
        <div class="col-xl-6 col-lg-7 col-md-8 col-sm-10">
            <div class="card checkout-card">
                <div class="card-header card-header-custom">
                    <h4 class="checkout-title">
                        <div class="checkout-icon">
                            <i class="fas fa-credit-card"></i>
                        </div>
                        Secure Checkout
                    </h4>
                </div>
                <div class="card-body card-body-custom">
                    <div class="info-alert">
                        <i class="fas fa-shield-alt"></i>
                        <p class="info-alert-text">
                            This is a simulated payment gateway for demo purposes.
                        </p>
                    </div>

                    <div class="order-summary">
                        <h5>
                            <i class="fas fa-file-invoice-dollar me-2"></i>
                            Order Summary
                        </h5>
                        <div class="order-item">
                            <span class="order-label">Medicine:</span>
                            <span class="order-value" th:text="${order.items[0].medicine.name}">Paracetamol</span>
                        </div>
                        <div class="order-item">
                            <span class="order-label">Quantity:</span>
                            <span class="order-value" th:text="${order.items[0].quantity}">2</span>
                        </div>
                        <div class="order-item">
                            <span class="order-label">Total Amount:</span>
                            <span class="total-amount">Rs. <span th:text="${order.totalAmount}">0.00</span></span>
                        </div>
                    </div>

                    <form th:action="@{'/orders/pay/' + ${order.id}}" method="post" class="payment-form">
                        <button type="submit" class="btn confirm-btn w-100">
                            <i class="fas fa-check-circle me-2"></i>Confirm Payment
                        </button>
                    </form>

                    <div class="text-center">
                        <a th:href="@{/orders}" class="back-btn">
                            <i class="fas fa-arrow-left"></i>Back to Orders
                        </a>
                    </div>

                    <div class="security-badge">
                        <i class="fas fa-lock"></i>
                        <span>Secured by 256-bit SSL encryption</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
