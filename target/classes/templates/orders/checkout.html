<!-- src/main/resources/templates/orders/checkout.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Order <span th:text="${order != null} ? ${order.id} : ''"></span></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; padding: 20px 0; }
        .checkout-container { max-width: 800px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); overflow: hidden; }
        .checkout-header { background: #0d6efd; color: white; padding: 20px 30px; }
        .checkout-header h1 { font-weight: 700; margin: 0; font-size: 2rem; }
        .table-items { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .table-items th, .table-items td { padding: 12px 15px; border-bottom: 1px solid #e9ecef; text-align: left; }
        .table-items th { background: #f8f9fa; font-weight: 600; color: #495057; }
        .text-end { text-align: right !important; }
        .summary-section { padding: 0 30px 20px; }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 1.05rem; }
        .summary-row.total { font-weight: 700; color: #0d6efd; border-top: 2px solid #0d6efd; padding-top: 12px; margin-top: 10px; }
        .btn-pay { margin-top: 20px; background: #0d6efd; color: white; border: none; padding: 10px 25px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-pay:hover { background: #0b5ed7; }
        @media print { body { background: white; padding: 0; } .checkout-container { box-shadow: none; border-radius: 0; } .btn-pay { display: none; } }
    </style>
</head>
<body>
<div class="checkout-container" th:if="${order != null}">
    <!-- Header -->
    <div class="checkout-header">
        <h1>Checkout</h1>
        <div class="invoice-meta">
            <p class="mb-0"><strong>Order #:</strong> <span th:text="${order.id}"></span></p>
            <p class="mb-0"><strong>Date:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}"></span></p>
        </div>
    </div>

    <!-- Customer Info -->
    <div class="customer-section" style="padding:20px 30px; border-bottom:1px solid #e9ecef;">
        <h5>Billed To:</h5>
        <p class="mb-1"><strong th:text="${order.customer != null} ? ${order.customer.firstName + ' ' + order.customer.lastName} : 'N/A'"></strong></p>
        <p class="mb-1" th:text="${order.customer != null} ? ${order.customer.email} : 'N/A'"></p>
        <p class="mb-0" th:text="${order.customer != null and order.customer.address != null} ? ${order.customer.address} : 'Address not provided'"></p>
    </div>

    <!-- Items Table -->
    <div style="padding: 0 30px;">
        <table class="table-items">
            <thead>
            <tr>
                <th>Medicine</th>
                <th class="text-end">Unit Price</th>
                <th class="text-end">Qty</th>
                <th class="text-end">Amount</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.items}">
                <td><strong th:text="${item.medicine != null} ? ${item.medicine.name} : 'N/A'"></strong></td>
                <td class="text-end">Rs. <span th:text="${#numbers.formatDecimal(item.pricePerUnit,1,2)}"></span></td>
                <td class="text-end" th:text="${item.quantity}"></td>
                <td class="text-end">Rs. <span th:text="${#numbers.formatDecimal(item.pricePerUnit * item.quantity,1,2)}"></span></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Summary -->
    <div class="summary-section">
        <div class="summary-row">
            <span>Subtotal:</span>
            <span>Rs. <span th:text="${#numbers.formatDecimal(order.totalAmount,1,2)}"></span></span>
        </div>
        <div th:if="${order.discountedTotal != null and order.discountedTotal < order.totalAmount}" class="summary-row" style="color:#198754; font-weight:600;">
            <span>Discount:</span>
            <span>- Rs. <span th:text="${#numbers.formatDecimal(order.totalAmount - order.discountedTotal,1,2)}"></span></span>
        </div>
        <div class="summary-row total">
            <span>GRAND TOTAL:</span>
            <span>Rs. <span th:text="${#numbers.formatDecimal(order.getDiscountedTotal() != null ? order.getDiscountedTotal() : order.totalAmount,1,2)}"></span></span>
        </div>
    </div>

    <!-- Confirm & Pay Button -->
    <div class="text-center" style="padding:0 30px 30px;">
        <form th:action="@{/orders/pay/{orderId}(orderId=${order.id})}" method="post">
            <button type="submit" class="btn-pay">
                <i class="fas fa-credit-card me-2"></i>Confirm & Pay
            </button>
        </form>
    </div>
</div>

<div th:if="${order == null}" class="text-center">
    <p>Order not found.</p>
</div>
</body>
</html>
