<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #0f0f23;
            background-image:
                    radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 40% 80%, rgba(120, 119, 198, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #e2e8f0;
        }

        .profile-container {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 24px;
            box-shadow:
                    0 25px 50px -12px rgba(0, 0, 0, 0.5),
                    0 0 0 1px rgba(148, 163, 184, 0.05);
            max-width: 900px;
            margin: 2rem auto;
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            color: #f1f5f9;
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #06b6d4);
        }

        .profile-header i {
            color: #94a3b8;
            margin-bottom: 1rem;
        }

        .profile-header h2 {
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #f1f5f9, #cbd5e1);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-header p {
            color: #94a3b8;
            font-weight: 400;
            margin: 0;
        }

        .profile-body {
            padding: 3rem 2.5rem;
            background: rgba(30, 41, 59, 0.3);
        }

        .info-card {
            background: rgba(51, 65, 85, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 16px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #3b82f6, #8b5cf6);
        }

        .info-card:hover {
            background: rgba(51, 65, 85, 0.6);
            border-color: rgba(148, 163, 184, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .info-label {
            font-weight: 600;
            color: #94a3b8;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .info-value {
            font-size: 1.125rem;
            color: #f1f5f9;
            font-weight: 500;
            line-height: 1.4;
        }

        .btn-action {
            border-radius: 12px;
            font-weight: 600;
            padding: 0.75rem 1.75rem;
            margin: 0.4rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary.btn-action {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.3);
        }

        .btn-primary.btn-action:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            box-shadow: 0 6px 20px 0 rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }

        .btn-outline-primary.btn-action {
            background: transparent;
            border: 2px solid #3b82f6;
            color: #3b82f6;
        }

        .btn-outline-primary.btn-action:hover {
            background: #3b82f6;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px 0 rgba(59, 130, 246, 0.3);
        }

        .btn-outline-secondary.btn-action {
            background: transparent;
            border: 2px solid #6b7280;
            color: #9ca3af;
        }

        .btn-outline-secondary.btn-action:hover {
            background: #6b7280;
            color: white;
            transform: translateY(-1px);
        }

        .alert {
            border-radius: 12px;
            margin-top: 1.5rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .row {
            margin: 0 -0.75rem;
        }

        .col-md-6 {
            padding: 0 0.75rem;
        }

        /* Action buttons container */
        .actions-container {
            background: rgba(30, 41, 59, 0.5);
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            padding: 2rem;
            margin: 2rem -2.5rem -3rem -2.5rem;
        }

        @media (max-width: 768px) {
            .profile-container {
                margin: 1rem;
                border-radius: 16px;
            }

            .profile-header {
                padding: 2rem 1.5rem;
            }

            .profile-body {
                padding: 2rem 1.5rem;
            }

            .actions-container {
                margin: 1.5rem -1.5rem -2rem -1.5rem;
                padding: 1.5rem;
            }

            .btn-action {
                display: block;
                width: 100%;
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
<div class="profile-container">
    <div class="profile-header">
        <i class="fas fa-user-circle fa-3x mb-3"></i>
        <h2>My Profile</h2>
        <p>Manage your account information</p>
    </div>

    <div class="profile-body">
        <div class="row">
            <div class="col-md-6">
                <div class="info-card">
                    <div class="info-label">First Name</div>
                    <div class="info-value" th:text="${user.firstName}">John</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Last Name</div>
                    <div class="info-value" th:text="${user.lastName}">Doe</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Email</div>
                    <div class="info-value" th:text="${user.email}">john@example.com</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Role</div>
                    <div class="info-value" th:text="${user.role}">CUSTOMER</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="info-card">
                    <div class="info-label">Phone Number</div>
                    <div class="info-value" th:text="${user.phoneNumber} ?: 'Not provided'">—</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Address</div>
                    <div class="info-value" th:text="${user.address} ?: 'Not provided'">—</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Member Since</div>
                    <div class="info-value" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">—</div>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/profile/edit}" class="btn btn-primary btn-action">
                <i class="fas fa-edit me-2"></i>Edit Profile
            </a>
            <a th:href="@{/auth/logout}" class="btn btn-outline-secondary btn-action">
                <i class="fas fa-sign-out-alt me-2"></i>Logout
            </a>
        </div>

        <div th:if="${param.updated}" class="alert alert-success text-center">
            <i class="fas fa-check-circle me-2"></i> Profile updated successfully!
        </div>

        <div class="actions-container">
            <div class="text-center">
                <a th:href="@{/prescriptions/upload}" class="btn btn-outline-primary btn-action">
                    <i class="fas fa-file-medical me-2"></i>Upload Prescription
                </a>
                <a th:href="@{/profile/edit}" class="btn btn-primary btn-action">
                    <i class="fas fa-edit me-2"></i>Edit Profile
                </a>
                <a th:href="@{/auth/logout}" class="btn btn-outline-secondary btn-action">
                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
