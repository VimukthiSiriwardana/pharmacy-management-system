<!-- src/main/resources/templates/feedback/my.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div th:replace="fragments/layout :: navbar"></div>

<div class="container mt-4">
    <h2><i class="fas fa-star me-2"></i>My Reviews</h2>

    <div th:if="${feedbackList.empty}" class="text-center py-5">
        <i class="fas fa-star-half-alt fa-3x text-muted mb-3"></i>
        <h4>You haven't submitted any reviews yet</h4>
        <a th:href="@{/store}" class="btn btn-primary mt-3">Browse Medicines</a>
    </div>

    <div th:unless="${feedbackList.empty}" class="row">
        <div class="col-12" th:each="feedback : ${feedbackList}">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 th:text="${feedback.medicine.name}">Paracetamol</h5>
                        <span class="badge bg-warning text-dark">
                            <i class="fas fa-star me-1"></i>
                            <span th:text="${feedback.rating}">5</span>/5
                        </span>
                    </div>
                    <p th:text="${feedback.comment} ?: 'No comment'">Great medicine!</p>
                    <small class="text-muted"
                           th:text="${'Reviewed on ' + #temporals.format(feedback.createdAt, 'dd MMM yyyy')}">
                        Reviewed on 27 Sep 2025
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
