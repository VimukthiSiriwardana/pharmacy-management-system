<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --success-color: #27ae60;
            --light-bg: #f8f9fa;
            --shadow-light: rgba(0, 0, 0, 0.08);
            --shadow-medium: rgba(0, 0, 0, 0.15);
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 0;
            max-width: 500px;
            width: 90%;
            margin: 0 auto;
            box-shadow:
                    0 10px 25px rgba(0, 0, 0, 0.1),
                    0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color), #34495e);
            color: white;
            padding: 20px 28px;
            text-align: center;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 18px;
            backdrop-filter: blur(10px);
        }

        .header-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .header-subtitle {
            opacity: 0.9;
            font-size: 13px;
            margin: 6px 0 0;
            font-weight: 400;
        }

        .card-body {
            background: white;
            padding: 28px;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 6px;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: var(--border-radius);
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #fafbfc;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
            background: white;
            transform: translateY(-1px);
        }

        .form-control::placeholder {
            color: #8899a6;
            font-size: 13px;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 70px;
            font-family: inherit;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-update {
            background: linear-gradient(135deg, var(--success-color), #2ecc71);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }

        .btn-update::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.3);
            background: linear-gradient(135deg, #2ecc71, var(--success-color));
        }

        .btn-update:hover::before {
            left: 100%;
        }

        .btn-update:active {
            transform: translateY(0);
        }

        .btn-cancel {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--border-radius);
            font-weight: 500;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            display: block;
        }

        .btn-cancel:hover {
            background: linear-gradient(135deg, #7f8c8d, #95a5a6);
            color: white;
            text-decoration: none;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(127, 140, 141, 0.2);
        }

        /* Input icons */
        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8899a6;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }

        .form-control.with-icon {
            padding-right: 45px;
        }

        /* Responsive design */
        @media (max-width: 576px) {
            body {
                padding: 10px;
            }

            .main-container {
                margin: 10px;
                max-width: none;
            }

            .card-header {
                padding: 24px 20px;
            }

            .card-body {
                padding: 24px 20px;
            }

            .header-title {
                font-size: 20px;
            }
        }

        /* Loading state */
        .btn-update:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-update:disabled:hover {
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
<div class="container-fluid vh-100 d-flex justify-content-center align-items-center">
    <div class="main-container">
        <div class="card-header">
            <div class="header-icon">
                <i class="fas fa-user-edit"></i>
            </div>
            <h1 class="header-title">Edit Profile</h1>
            <p class="header-subtitle">Update your personal information</p>
        </div>
        <div class="card-body">
            <form th:action="@{/profile/update}" th:object="${user}" method="post">
                <!-- Hidden fields to preserve ID, email, role -->
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{email}"/>
                <input type="hidden" th:field="*{role}"/>

                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <div class="input-group">
                        <input type="text" th:field="*{firstName}" class="form-control with-icon" placeholder="Enter your first name" required>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <div class="input-group">
                        <input type="text" th:field="*{lastName}" class="form-control with-icon" placeholder="Enter your last name" required>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <div class="input-group">
                        <input type="text" th:field="*{phoneNumber}" class="form-control with-icon" placeholder="Enter your phone number">
                        <i class="fas fa-phone input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Address</label>
                    <div class="input-group">
                        <textarea th:field="*{address}" class="form-control with-icon" rows="3" placeholder="Enter your address"></textarea>
                        <i class="fas fa-map-marker-alt input-icon" style="top: 20px;"></i>
                    </div>
                </div>

                <!-- Added Discount Type Selection -->
                <div class="form-group">
                    <label class="form-label">Discount Type</label>
                    <select th:field="*{discountType}" class="form-control">
                        <option value="REGULAR">Regular</option>
                        <option value="SENIOR">Senior</option>
                        <option value="LOYALTY">Loyalty</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-update">
                        <i class="fas fa-save me-2"></i>Update Profile
                    </button>
                    <a th:href="@{/profile}" class="btn-cancel">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
