<!-- src/main/resources/templates/admin/orders/pending.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pending Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Pending Orders</h2>

    <!-- ✅ Alert Messages -->
    <div th:if="${param.approved}" class="alert alert-success">Order approved successfully!</div>
    <div th:if="${param.paid}" class="alert alert-info">Order marked as paid!</div>
    <div th:if="${param.error}" class="alert alert-danger">Something went wrong. Please try again.</div>

    <!-- ✅ Orders Table -->
    <table class="table table-bordered table-hover bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.customerName}"></td>
            <td>Rs. <span th:text="${order.total}"></span></td>
            <td th:text="${order.status}"></td>
            <td>
                <!-- ✅ Approve Form -->
                <form th:action="@{/admin/orders/approve/{id}(id=${order.id})}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-success btn-sm">Approve</button>
                </form>

                <!-- ✅ Mark as Paid Form -->
                <form th:action="@{/admin/orders/mark-paid/{id}(id=${order.id})}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-primary btn-sm">Mark as Paid</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>

</body>
</html>
