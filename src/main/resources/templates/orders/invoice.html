<!-- src/main/resources/templates/orders/invoice.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Invoice #' + ${order.id}">Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        body {
            background: #f8f9fa;
            padding: 20px 0;
        }
        .invoice-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .invoice-header {
            background: #0d6efd;
            color: white;
            padding: 20px 30px;
        }
        .invoice-header h1 {
            font-weight: 700;
            margin: 0;
            font-size: 2rem;
        }
        .invoice-subtitle {
            opacity: 0.9;
            font-size: 1.1rem;
            margin-top: 5px;
        }
        .invoice-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.95rem;
        }
        .company-info {
            text-align: right;
        }
        .customer-section {
            padding: 20px 30px;
            border-bottom: 1px solid #e9ecef;
        }
        .table-items {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .table-items th,
        .table-items td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }
        .table-items th {
            background: #f8f9fa;
            font-weight: 600;
            color: #495057;
        }
        .text-end {
            text-align: right !important;
        }
        .summary-section {
            padding: 0 30px 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 1.05rem;
        }
        .summary-row.total {
            font-weight: 700;
            color: #0d6efd;
            border-top: 2px solid #0d6efd;
            padding-top: 12px;
            margin-top: 10px;
        }
        .discount-row {
            color: #198754;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .badge-paid {
            background: #d1e7dd;
            color: #0f5132;
        }
        .print-button {
            margin-top: 20px;
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .print-button:hover {
            background: #0b5ed7;
        }
        @media print {
            body { background: white; padding: 0; }
            .invoice-container { box-shadow: none; border-radius: 0; }
            .print-button { display: none; }
        }
        @media (max-width: 768px) {
            .invoice-meta, .company-info {
                text-align: left !important;
            }
            .invoice-meta { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
<div class="invoice-container">
    <!-- Header -->
    <div class="invoice-header">
        <h1>PharmaCare Pharmacy</h1>
        <div class="invoice-subtitle">Professional Healthcare Solutions</div>
        <div class="invoice-meta">
            <div>
                <p class="mb-0"><strong>Invoice #:</strong> <span th:text="${order.id}"></span></p>
                <p class="mb-0"><strong>Date:</strong>
                    <span th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}"></span>
                </p>
            </div>
            <div class="company-info">
                <p class="mb-0">123 Health Street, Colombo</p>
                <p class="mb-0">Phone: +94 11 234 5678</p>
                <p class="mb-0">Email: info@pharmacare.lk</p>
            </div>
        </div>
    </div>

    <!-- Customer Info -->
    <div class="customer-section">
        <h5>Billed To:</h5>
        <p class="mb-1"><strong th:text="${order.customer.firstName + ' ' + order.customer.lastName}"></strong></p>
        <p class="mb-1" th:text="${order.customer.email}"></p>
        <p class="mb-0" th:text="${order.customer.address ?: 'Address not provided'}"></p>
    </div>

    <!-- Items Table -->
    <div style="padding: 0 30px;">
        <table class="table-items">
            <thead>
            <tr>
                <th>Medicine</th>
                <th class="text-end">Unit Price</th>
                <th class="text-end">Qty</th>
                <th class="text-end">Amount</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.items}">
                <td><strong th:text="${item.medicine.name}"></strong></td>
                <td class="text-end">Rs. <span th:text="${#numbers.formatDecimal(item.pricePerUnit, 1, 2)}"></span></td>
                <td class="text-end" th:text="${item.quantity}"></td>
                <td class="text-end">Rs. <span th:text="${#numbers.formatDecimal(item.pricePerUnit * item.quantity, 1, 2)}"></span></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Summary -->
    <div class="summary-section">
        <div class="summary-row">
            <span>Subtotal:</span>
            <span>Rs. <span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></span>
        </div>

        <!-- Discount Row (Only if applied) -->
        <div th:if="${order.discountedTotal != null and order.discountedTotal.compareTo(order.totalAmount) < 0}" class="summary-row discount-row">
            <span>Discount (<span th:text="${order.customer.discountType}"></span>):</span>
            <span>- Rs. <span th:text="${#numbers.formatDecimal(order.totalAmount.subtract(order.discountedTotal), 1, 2)}"></span></span>
        </div>

        <!-- Final Total -->
        <div class="summary-row total">
            <span>GRAND TOTAL:</span>
            <span>Rs. <span th:text="${#numbers.formatDecimal(order.getDiscountedTotal(), 1, 2)}"></span></span>
        </div>

        <!-- Payment Status -->
        <div class="summary-row" style="margin-top: 20px;">
            <span>Payment Status:</span>
            <span>
                <span class="status-badge badge-paid" th:text="${order.status}"></span>
            </span>
        </div>
    </div>

    <!-- Print Button -->
    <div class="text-center" style="padding: 0 30px 30px;">
        <button class="print-button" onclick="window.print()">
            <i class="fas fa-print me-2"></i>Print Invoice
        </button>
    </div>
</div>
</body>
</html>
