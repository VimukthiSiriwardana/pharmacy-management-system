<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Upload Prescription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .upload-container {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .upload-container:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background: linear-gradient(135deg, #4a6cf7 0%, #667eea 100%);
            border: none;
            padding: 2rem 2rem 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }

        .card-title {
            font-size: 1.75rem;
            font-weight: 600;
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .card-body {
            padding: 2.5rem;
        }

        .file-upload-wrapper {
            position: relative;
            margin: 2rem 0;
        }

        .file-input-container {
            border: 3px dashed #4a6cf7;
            border-radius: 15px;
            padding: 3rem 2rem;
            text-align: center;
            background: linear-gradient(135deg, rgba(74, 108, 247, 0.05) 0%, rgba(102, 126, 234, 0.05) 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .file-input-container:hover {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(74, 108, 247, 0.1) 0%, rgba(102, 126, 234, 0.1) 100%);
            transform: translateY(-2px);
        }

        .file-input-container input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }

        .upload-icon {
            font-size: 3rem;
            color: #4a6cf7;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .file-input-container:hover .upload-icon {
            transform: scale(1.1);
            color: #667eea;
        }

        .upload-text {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }

        .upload-subtext {
            font-size: 0.9rem;
            color: #adb5bd;
        }

        .btn-upload {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            border-radius: 50px;
            padding: 1rem 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(40, 167, 69, 0.4);
            background: linear-gradient(135deg, #20c997 0%, #28a745 100%);
        }

        .btn-back {
            background: transparent;
            border: 2px solid #6c757d;
            border-radius: 50px;
            padding: 0.75rem 1.5rem;
            color: #6c757d;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: #6c757d;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 117, 125, 0.3);
        }

        .alert-danger {
            background: linear-gradient(135deg, rgba(220, 53, 69, 0.1) 0%, rgba(220, 53, 69, 0.05) 100%);
            border: 1px solid rgba(220, 53, 69, 0.2);
            border-radius: 12px;
            color: #721c24;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .form-text {
            background: rgba(108, 117, 125, 0.1);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            margin-top: 1rem;
            display: inline-block;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .medical-bg {
            position: absolute;
            top: -50px;
            right: -50px;
            font-size: 8rem;
            color: rgba(255, 255, 255, 0.1);
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="upload-container">
                <div class="card-header text-white position-relative">
                    <i class="fas fa-file-medical medical-bg"></i>
                    <div class="content-wrapper">
                        <h4 class="card-title">
                            <i class="fas fa-file-medical me-3"></i>Upload Prescription
                        </h4>
                        <p class="mb-0 opacity-75">Securely upload your medical prescription</p>
                    </div>
                </div>

                <div class="card-body">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/prescriptions/upload}" method="post" enctype="multipart/form-data">
                        <div class="file-upload-wrapper">
                            <label class="form-label">
                                <i class="fas fa-cloud-upload-alt me-2"></i>
                                Select Prescription Document
                            </label>

                            <div class="file-input-container">
                                <input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required>
                                <i class="fas fa-cloud-upload-alt upload-icon"></i>
                                <div class="upload-text">Drag & drop your file here</div>
                                <div class="upload-subtext">or click to browse</div>
                            </div>

                            <div class="form-text">
                                <i class="fas fa-info-circle me-2"></i>
                                Supported formats: PDF, JPG, PNG • Maximum size: 5MB
                            </div>
                        </div>

                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-success btn-upload">
                                <i class="fas fa-upload me-2"></i>Upload Prescription
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/prescriptions}" class="btn btn-back">
                            <i class="fas fa-arrow-left me-2"></i>Back to Prescriptions
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Enhanced file upload interaction
    document.addEventListener('DOMContentLoaded', function() {
        const fileInput = document.querySelector('input[type="file"]');
        const container = document.querySelector('.file-input-container');
        const uploadText = document.querySelector('.upload-text');
        const uploadSubtext = document.querySelector('.upload-subtext');

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                const fileName = e.target.files[0].name;
                uploadText.textContent = fileName;
                uploadSubtext.textContent = 'File selected • Click upload to proceed';
                container.style.borderColor = '#28a745';
                container.style.background = 'linear-gradient(135deg, rgba(40, 167, 69, 0.1) 0%, rgba(32, 201, 151, 0.1) 100%)';
            }
        });

        // Drag and drop functionality
        container.addEventListener('dragover', function(e) {
            e.preventDefault();
            container.style.borderColor = '#28a745';
            container.style.background = 'linear-gradient(135deg, rgba(40, 167, 69, 0.15) 0%, rgba(32, 201, 151, 0.15) 100%)';
        });

        container.addEventListener('dragleave', function(e) {
            e.preventDefault();
            container.style.borderColor = '#4a6cf7';
            container.style.background = 'linear-gradient(135deg, rgba(74, 108, 247, 0.05) 0%, rgba(102, 126, 234, 0.05) 100%)';
        });

        container.addEventListener('drop', function(e) {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                const changeEvent = new Event('change', { bubbles: true });
                fileInput.dispatchEvent(changeEvent);
            }
        });
    });
</script>
</body>
</html>
